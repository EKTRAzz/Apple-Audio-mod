name: Build HeSuVi iOS Dylib

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcrun --sdk iphoneos --show-sdk-path

      - name: Compile HeSuVi.dylib
        run: |
          make clean
          make

      - name: Ad-hoc Code Sign (Pre-signing)
        run: |
          codesign -f -s - HeSuVi.dylib
          file HeSuVi.dylib
          otool -L HeSuVi.dylib

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HeSuVi.dylib
          path: HeSuVi.dylib
          retention-days: 30
